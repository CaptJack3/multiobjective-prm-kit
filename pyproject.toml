[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiobjective-prm-kit"
version = "0.4.0"
description = "Portable, configurable robot PRM and multiobjective environment experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2,<3", "scipy>=1.13,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
robot = ["pin==3.9.0", "coal==3.0.2", "cmeel-urdfdom>=4,<5", "cmeel-tinyxml2>=10,<11", "trimesh>=4.4,<5", "rtree>=1.3,<2"]
fast = ["numba>=0.61,<0.69"]
usd = ["usd-core>=25.5,<27", "trimesh>=4.4,<5"]
dev = ["pytest>=8,<10", "build>=1.2,<2"]
render = ["matplotlib>=3.8,<4", "imageio-ffmpeg>=0.5,<0.7"]

[project.scripts]
prmkit = "prmkit.cli:main"
pareto = "prmkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prmkit = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

