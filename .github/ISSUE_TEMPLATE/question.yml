name: Usage question or feature request
description: Ask about an experiment or propose a capability.
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the scene, robot, query and desired result.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Relevant guide, configuration, command, and where you got stuck.
