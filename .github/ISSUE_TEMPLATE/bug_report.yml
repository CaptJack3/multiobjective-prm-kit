name: Bug report
description: Report a reproducible setup or workflow problem.
title: '[Bug] '
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Command and minimal configuration
      description: Include the command and a small YAML/JSON example. Remove private data.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, prmkit doctor output and relevant error/log lines.
      render: text
    validations:
      required: true
