name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/check_docs.py
  robot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/prmkit-matplotlib
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[robot,render,usd,fast,dev]' quickjs==1.19.4
      - run: prmkit doctor
      - run: python -m pytest -q
      - run: prmkit run examples/01_single_wall.yaml --output runs/ci_wall
      - run: python examples/research_showcase/verify_examples.py --report runs/example_check.json
      - run: python -m build
